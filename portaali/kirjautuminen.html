<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kirjaudu portaaliin — Hyrrä</title>
<meta name="description" content="Hyrrän hallintaportaali. Kirjaudu sisään hallitaksesi Hyrrää, lukeaksesi puheluitasi ja säätääksesi asetuksia.">
<meta name="theme-color" content="#0F3D3E">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="shared.css">
<style>
  body{display:grid;place-items:center;padding:40px 20px}
  .login-card{max-width:420px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:38px 34px;box-shadow:var(--shadow-lg)}
  .brand-c{display:flex;align-items:center;gap:11px;justify-content:center;font-size:24px;font-weight:800;letter-spacing:-0.02em;color:var(--deep);margin-bottom:6px}
  .brand-c .spin-mark{width:30px;height:30px;animation:spinMark 2.4s linear infinite}
  .login-card h1{font-size:22px;font-weight:800;color:var(--deep);text-align:center;margin-bottom:6px;letter-spacing:-0.02em}
  .login-card .sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:26px}
  .links{margin-top:18px;text-align:center;font-size:13px;color:var(--muted)}
  .links a{color:var(--deep);font-weight:600}
  .links a:hover{color:var(--amber-2)}
  .back-link{position:fixed;top:22px;left:22px;font-size:13px;color:var(--muted);font-weight:600}
  .back-link:hover{color:var(--deep)}
  .btn-login{width:100%;margin-top:4px;justify-content:center}
  .reset-note{font-size:12.5px;color:var(--muted);text-align:center;margin-top:8px;display:none}
  .reset-note.show{display:block}
</style>
</head>
<body>
<a href="/" class="back-link">← Etusivulle</a>

<div class="login-card">
  <div class="brand-c">
    <svg class="spin-mark" viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="#FFB627"/><circle cx="32" cy="32" r="10" fill="#0F3D3E"/><circle cx="32" cy="32" r="2" fill="#FFB627"/><circle cx="32" cy="11" r="3.2" fill="#0F3D3E"/></svg>
    <span>hyrrä</span>
  </div>
  <h1>Kirjaudu portaaliin</h1>
  <p class="sub">Hallitse Hyrrää, lue puheluita ja säädä asetuksia.</p>

  <div class="banner err" id="err" style="display:none"></div>
  <div class="banner ok" id="ok" style="display:none"></div>

  <form id="loginForm" autocomplete="on">
    <div class="field">
      <label for="email">Sähköposti</label>
      <input class="input" id="email" type="email" required autocomplete="email" placeholder="info@yritys.fi" autocapitalize="none" autocorrect="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="password">Salasana</label>
      <input class="input" id="password" type="password" required autocomplete="current-password" placeholder="••••••••">
    </div>
    <button type="submit" class="btn btn-primary btn-login" id="submitBtn">Kirjaudu sisään →</button>
  </form>

  <div class="links">
    <a href="#" id="resetLink">Unohditko salasanan?</a>
  </div>
  <div class="reset-note" id="resetNote">Syötä ensin sähköpostisi kenttään, niin lähetämme nollauslinkin.</div>
</div>

<!-- supabase-js (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function(){
  'use strict';
  const SB = window.SB;
  const form = document.getElementById('loginForm');
  const emailI = document.getElementById('email');
  const passI = document.getElementById('password');
  const errB = document.getElementById('err');
  const okB = document.getElementById('ok');
  const btn = document.getElementById('submitBtn');
  const resetNote = document.getElementById('resetNote');

  function showErr(m){ errB.textContent = m; errB.style.display='flex'; okB.style.display='none'; }
  function showOk(m){ okB.textContent = m; okB.style.display='flex'; errB.style.display='none'; }
  function clearMsg(){ errB.style.display='none'; okB.style.display='none'; }

  // Jos jo kirjautunut → ohjaa roolin mukaan
  (async function(){
    if (!SB) return;
    const { data } = await SB.auth.getSession();
    if (data && data.session) routeByRole();
  })();

  async function routeByRole(){
    const prof = await window.Hyrra.loadProfile();
    if (prof && prof.role === 'admin') location.href = 'admin.html';
    else location.href = 'asiakas.html';
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    clearMsg();
    const email = emailI.value.trim().toLowerCase();
    const password = passI.value;
    if (!email || !password){ showErr('Sähköposti ja salasana vaaditaan.'); return; }
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Kirjaudutaan…';
    const { error } = await SB.auth.signInWithPassword({ email, password });
    if (error){
      showErr('Kirjautuminen epäonnistui. Tarkista sähköposti ja salasana.');
      btn.disabled = false; btn.textContent = 'Kirjaudu sisään →';
      return;
    }
    await routeByRole();
  });

  // Salasanan nollaus
  document.getElementById('resetLink').addEventListener('click', async function(e){
    e.preventDefault();
    clearMsg();
    const email = emailI.value.trim().toLowerCase();
    if (!email){ resetNote.classList.add('show'); emailI.focus(); return; }
    resetNote.classList.remove('show');
    const { error } = await SB.auth.resetPasswordForEmail(email, {
      redirectTo: location.origin + location.pathname.replace('kirjautuminen.html','') + 'kirjautuminen.html'
    });
    if (error) showErr('Nollauslinkin lähetys epäonnistui. Yritä myöhemmin uudelleen.');
    else showOk('Lähetimme salasanan nollauslinkin osoitteeseen ' + email + ', jos tili on olemassa.');
  });
})();
</script>
</body>
</html>
